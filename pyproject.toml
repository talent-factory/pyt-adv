[project]
name = "pyt-adv"
version = "0.1.0"
description = "Advanced Python"
authors = [{name = "Daniel Senften", email = "daniel.senften@talent-factory.ch"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.4",
    "pika>=1.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyt-adv"]